<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>練習1</title>

    <style>
        .changed{
            color: red;
        }
    </style>
</head>
<body>

    <p id="msg">こんにちは</p>

    <button id="btn">ボタン</button>

    <script>

        const msg = document.getElementById("msg");
        const btn = document.getElementById("btn");


        btn.addEventListener("click", function() {

            msg.textContent = "押しました";

            msg.classList.add("changed");

        });
    </script>

</body>
</html>
