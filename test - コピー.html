<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<style>
    .changed{
        color:red;
    }
</style>
<body>
    <p id = "msg">こんにちは</p>
    <button id = "btn">押せ</button>
    
    <script>
        const msg = document.getElementById("msg");
        const btn = document.getElementById("btn");

        btn.addEventListener("click",function(){
            msg.textContent = "押したよ";
            msg.classList.add("changed");
        });
    </script>
</body>
</html>
